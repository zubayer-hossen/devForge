<!doctype html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://i.ibb.co.com/5XqVP6j6/Dev-Forge-Neon-Tech-Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevForge: Learn Together. Build Together. Grow Together. ডেভেলপারদের প্রাইভেট লার্নিং কমিউনিটি।" />
    <meta name="theme-color" content="#0b1020" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b1020; }
      #boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; box-sizing: border-box; color: #f8fafc; font-family: Inter, system-ui, sans-serif; text-align: center; background: radial-gradient(ellipse at 15% 15%, rgba(124,92,255,.2), transparent 42%), radial-gradient(ellipse at 85% 30%, rgba(59,130,246,.16), transparent 38%), #0b1020; }
      #boot-screen > div { max-width: 720px; }
      #boot-screen .boot-brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 28px; color: #c4b5fd; font-weight: 800; letter-spacing: .04em; }
      #boot-screen h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.2; font-weight: 800; }
      #boot-screen p { max-width: 600px; margin: 20px auto 0; color: #cbd5e1; font-size: 1rem; line-height: 1.8; }
      #boot-screen .boot-status { margin-top: 30px; color: #94a3b8; font-size: .875rem; }
      #boot-screen .boot-dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #8b5cf6; box-shadow: 0 0 16px #8b5cf6; }
      @media (prefers-reduced-motion: reduce) { #boot-screen * { animation: none !important; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>DevForge</title>
    <script>
      // পেজ লোডের আগেই থিম বসানো হয়, যাতে ঝলকানি না হয়
      try {
        var t = localStorage.getItem('df_theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <main id="boot-screen" role="status" aria-live="polite">
        <div>
          <div class="boot-brand"><span aria-hidden="true">✦</span> DEVFORGE</div>
          <h1>একসঙ্গে শিখুন,<br />একসঙ্গে গড়ুন</h1>
          <p>ডেডিকেটেড ডেভেলপারদের শেখা, সহযোগিতা এবং বাস্তব প্রজেক্ট তৈরির কমিউনিটি।</p>
          <div class="boot-status"><span class="boot-dot" aria-hidden="true"></span>DevForge প্রস্তুত হচ্ছে…</div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
